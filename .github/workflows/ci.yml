name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [rundown-updated]
  workflow_dispatch:
    inputs:
      rundown_ref:
        description: 'Rundown git ref (branch/tag/SHA) to test against. Leave empty for current dependency.'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    defaults:
      run:
        working-directory: plugin/core

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: plugin/core/package-lock.json

      - name: Validate dispatch payload
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -z "${{ github.event.client_payload.sha }}" ]; then
            echo "ERROR: repository_dispatch missing required 'sha' in client_payload"
            exit 1
          fi
        working-directory: .

      - name: Override @rundown/cli with git ref
        if: inputs.rundown_ref != '' || github.event_name == 'repository_dispatch'
        run: |
          REF="${{ inputs.rundown_ref || github.event.client_payload.sha || 'main' }}"
          echo "Installing @rundown/cli from git ref: $REF"
          # Use GitPkg to install from monorepo subdirectory (npm can't do this natively)
          npm pkg set "dependencies.@rundown/cli=https://gitpkg.now.sh/tobyhede/rundown/packages/cli?${REF}"
          cat package.json | grep rundown

      - name: Install dependencies (standard)
        if: inputs.rundown_ref == '' && github.event_name != 'repository_dispatch'
        run: npm ci

      - name: Install dependencies (with override)
        if: inputs.rundown_ref != '' || github.event_name == 'repository_dispatch'
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Report rundown version
        if: inputs.rundown_ref != '' || github.event_name == 'repository_dispatch'
        run: |
          echo "Tested with @rundown/cli:"
          npm ls @rundown/cli || true
